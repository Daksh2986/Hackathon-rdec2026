[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ps05-repository-auditor"
version = "0.1.0"
description = "Evidence-linked dependency and Python source auditor for PS05."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ps05-audit = "repo_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_auditor = ["web/*.html", "web/*.css", "web/*.js"]
